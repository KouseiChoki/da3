      model_dir: "depth-anything/DA3-SMALL"
    num_cameras: 1
    resolution: [1024, 1024]
    precision: "fp32"
    device: "mps"
    num_frames: 100
    warmup_frames: 10
    save_depth_maps: false
    save_comparison_video: false

